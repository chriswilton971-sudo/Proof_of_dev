# gitleaks allowlist for known false positives and example/demo files
# Updated to gitleaks v8+ format: a single [allowlist] table with arrays.

title = "gitleaks allowlist"

[allowlist]
description = "Ignore example/demo files and test fixtures"
paths = [
  "^\\.env.example$",
  "^SUBMISSION.md$",
  "^SUBMIT_PARAMS.json$",
  "^services/analysis/mock.js$",
  "^apps/web/lib/eas/config.ts$"
]

# Add specific commits or repos to allow if needed in the future:
# commits = [ "d3adb33f", "aa11bb22" ]
# repos = [ "https://github.com/example/ignore-this-repo.git" ]
