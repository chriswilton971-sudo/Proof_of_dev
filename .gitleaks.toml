# gitleaks allowlist for known false positives and example/demo files

# This file tells gitleaks to ignore certain repository paths that intentionally
# contain 0x-prefixed demo addresses or placeholder private-key-style strings.
# Do NOT add real secrets here — if a real secret was committed, revoke/rotate
# it immediately and remove it from the repo instead of allowing it.

[[allowlist]]
description = "Ignore example env file with placeholders"
paths = ["^\\.env.example$"]

[[allowlist]]
description = "Ignore submission artifacts and test fixtures"
paths = ["^SUBMISSION.md$", "^SUBMIT_PARAMS.json$", "^services/analysis/mock.js$"]

[[allowlist]]
description = "Ignore demo EAS config with empty schema UID"
paths = ["^apps/web/lib/eas/config.ts$"]
